services:
  - type: web
    name: zadachnik
    runtime: node
    plan: starter
    rootDir: task-manager-specs/zadachnik-app
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npx prisma db push && npm run db:seed && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/zadachnik.db
      - key: ACCESS_TOKEN_PEPPER
        generateValue: true
      - key: INITIAL_ACCESS_TOKEN
        generateValue: true
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    disk:
      name: zadachnik-data
      mountPath: /var/data
      sizeGB: 1
